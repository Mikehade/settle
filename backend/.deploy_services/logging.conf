; Gunicorn --log-config file (Python logging fileConfig format).
; Keeps gunicorn's error/access logs on stdout/stderr so supervisor captures
; them into the configured logfiles.

[loggers]
keys=root,gunicorn.error,gunicorn.access,uvicorn,axom

[handlers]
keys=console

[formatters]
keys=generic

[logger_root]
level=INFO
handlers=console

[logger_gunicorn.error]
level=INFO
handlers=console
propagate=0
qualname=gunicorn.error

[logger_gunicorn.access]
level=INFO
handlers=console
propagate=0
qualname=gunicorn.access

[logger_uvicorn]
level=INFO
handlers=console
propagate=0
qualname=uvicorn

[logger_axom]
level=INFO
handlers=console
propagate=0
qualname=axom

[handler_console]
class=StreamHandler
formatter=generic
args=(sys.stdout,)

[formatter_generic]
format=%(asctime)s [%(process)d] [%(levelname)s] %(name)s: %(message)s
datefmt=%Y-%m-%d %H:%M:%S
class=logging.Formatter
