; Supervisor config for running settle AI on a bare-metal / VM instance.

; Adjust these to your box before use:
;   - APP_DIR  : where the repo is checked out   (default /home/ubuntu/settle/backend)
;   - VENV     : your virtualenv bin dir          (default /home/ubuntu/venv/bin)
;   - user     : the OS user that owns the files  (default ubuntu)
;   - inet_http_server username/password          (CHANGE THESE)

; Gunicorn runs 4 Uvicorn workers. Because settle's WebSocket registry is
; Redis-backed with a pub/sub fan-out (utils/connection_registry.py +
; utils/ws_pubsub.py), broadcasts work correctly across all 4 workers.

; Start with:  supervisord -c .deploy-services/supervisord.conf

[supervisord]
logfile=/home/ubuntu/var/settle-log/supervisord.log
user=ubuntu
nodaemon=true
loglevel=info

[inet_http_server]
port=*:9053
username=admin
password=super_settle

[supervisorctl]
serverurl=http://localhost:9053
username=admin
password=super_settle

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:gunicorn]
# command=/home/ubuntu/miniconda3/envs/settle/bin/gunicorn --log-config /home/ubuntu/settle/backend/.deploy-services/logging.conf -k uvicorn.workers.UvicornWorker -w 4 --timeout 4000 --bind 0.0.0.0:8090 main:app
# command=/home/ubuntu/venv/bin/gunicorn
command=/home/ubuntu/miniconda3/envs/settle/bin/gunicorn
    --log-config /home/ubuntu/settle/backend/.deploy_services/logging.conf
    -k uvicorn.workers.UvicornWorker
    -w 2
    --timeout 4000
    --bind 0.0.0.0:8090
    main:app
directory=/home/ubuntu/settle/backend
user=ubuntu
stdout_logfile=/home/ubuntu/var/settle-log/gunicorn/output.log
stderr_logfile=/home/ubuntu/var/settle-log/gunicorn/error.log
autostart=true
autorestart=true
startsecs=10
environment=PYTHONUNBUFFERED=1,
# APP_ENV=production
